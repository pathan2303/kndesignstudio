<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="style.css">
    <title>KN DESIGN STUDIO</title>
</head>
<body>

    <div id="intro-screen">
        <video id="bg-video" autoplay muted playsinline loop>
            <source src="assets/intro.mp4" type="video/mp4">
        </video>
        <button id="explore-btn" class="glass-btn">EXPLORE STUDIO</button>
    </div>

    <div id="portfolio">
        <img src="assets/logo.png" class="logo">
        
        <h2>About KN Design Studio</h2>
        <p style="text-align:center; color:#ccc; max-width:500px; margin:0 auto 50px;">Established in Jan 2022, KN Design Studio has redefined luxury for 4.5 years. We blend precision, aesthetics, and functionality to curate timeless interior spaces.</p>

        <h2>Interior Gallery</h2>
        <div class="swiper imgSwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide" onclick="openModal('assets/project1.jpg')"><img src="assets/project1.jpg"></div>
            </div>
        </div>

        <h2>Video Walkthroughs</h2>
        <div class="swiper vidSwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><video src="assets/video1.mp4" muted loop autoplay playsinline></video></div>
            </div>
        </div>

        <a href="https://wa.me/918208591573" class="whatsapp-btn">CONTACT US ON WHATSAPP</a>
    </div>

    <div id="modal" class="modal" onclick="this.style.display='none'">
        <img id="modalImg" src="">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
