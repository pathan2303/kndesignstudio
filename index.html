<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="style.css">
    <title>KN Studio | Interior Design</title>
</head>
<body>

    <div id="intro-screen">
        <video src="assets/intro.mp4" autoplay muted playsinline></video>
    </div>

    <div id="main-content">
        <header>
            <h1>KN Studio</h1>
            <p>Established 4.5 Years Ago</p>
        </header>

        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide card" onclick="openModal('assets/project1.jpg')">
                    <img src="assets/project1.jpg">
                </div>
                <div class="swiper-slide card">
                    <video src="assets/video1.mp4" controls></video>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal" onclick="this.style.display='none'">
        <img id="modal-content">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
