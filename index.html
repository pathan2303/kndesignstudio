<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KN DESIGN STUDIO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Intro Screen -->
    <div id="intro-screen">
        <video id="intro-video" src="assets/intro.mp4" autoplay muted playsinline></video>
        <button id="exploreBtn" class="explore-btn" onclick="showContent()">EXPLORE STUDIO</button>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="main-content">
        <header>
            <img src="assets/logo.png" class="logo" alt="KN Studio Logo">
        </header>

        <section class="about">
            <h2>About KN Design Studio</h2>
            <p>Established in Jan 2022, KN Design Studio has been redefining luxury for 4.5 years. We blend precision, aesthetics, and functionality to curate timeless interior spaces that reflect your unique lifestyle.</p>
        </section>

        <h2>Interior Gallery</h2>
        <div class="swiper imgSwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="assets/project1.jpg" alt="Interior"></div>
                <div class="swiper-slide"><img src="assets/project2.jpg" alt="Interior"></div>
            </div>
        </div>

        <h2>Video Walkthroughs</h2>
        <div class="swiper vidSwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><video src="assets/video1.mp4" muted loop autoplay playsinline></video></div>
            </div>
        </div>

        <a href="https://wa.me/918208591573" class="whatsapp-btn">CONTACT US ON WHATSAPP</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
