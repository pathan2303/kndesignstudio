<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KN DESIGN STUDIO</title>
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Intro Screen (Video Intro) -->
    <div id="intro-screen">
        <video src="assets/intro.mp4" autoplay muted playsinline></video>
    </div>

    <!-- Header Section -->
    <header>
        <img src="assets/logo.png" alt="KN Studio" class="logo">
        <div class="tagline">Established 4.5 Years Ago</div>
    </header>

    <!-- 3D Swiper Gallery -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            
            <!-- Image Card (Clickable) -->
            <div class="swiper-slide card" onclick="openModal('assets/project1.jpg')">
                <img src="assets/project1.jpg" alt="Project">
            </div>

            <!-- Video Card -->
            <div class="swiper-slide card">
                <video src="assets/video1.mp4" muted loop autoplay playsinline></video>
            </div>

            <!-- Add more project cards below -->
            <div class="swiper-slide card" onclick="openModal('assets/project2.jpg')">
                <img src="assets/project2.jpg" alt="Project">
            </div>

        </div>
    </div>

    <!-- Fullscreen Modal for Images -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <img id="modalImg" src="" alt="Zoomed Image">
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // 1. Intro Screen Logic
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('intro-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('intro-screen').style.display = 'none';
                }, 1000);
            }, 5000); // Intro runs for 5 seconds
        });

        // 2. Swiper Initialization
        var swiper = new Swiper(".mySwiper", {
            effect: "coverflow",
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: "auto",
            loop: true,
            coverflowEffect: {
                rotate: 40,
                stretch: 0,
                depth: 100,
                modifier: 1,
                slideShadows: true,
            },
            autoplay: {
                delay: 2500,
                disableOnInteraction: false,
            },
        });

        // 3. Modal Functions
        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>
</body>
</html>
